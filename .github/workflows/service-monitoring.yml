name: Service Monitoring

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run health check
        env:
          API_URL: ${{ vars.API_URL || 'http://localhost:3501' }}
        run: python monitoring/api_health_monitor.py

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-metrics
          path: monitoring/service_metrics.csv
          retention-days: 30




# Workflow de monitoring du service - v1
