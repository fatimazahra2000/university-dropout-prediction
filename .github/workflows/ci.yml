name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.128.0 uvicorn==0.40.0 pandas==2.3.3 scikit-learn==1.9.0 joblib==1.5.3 pytest==8.3.4 httpx==0.28.1

      - name: Run tests
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f deployment/Dockerfile -t university-dropout-api:ci .

      - name: Run API container
        run: docker run -d --name api-test -p 3501:8000 -v ${{ github.workspace }}/ml/models:/app/ml/models university-dropout-api:ci

      - name: Wait for API to be ready
        run: |
          for i in {1..10}; do
            if curl -sf http://localhost:3501/health; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API... attempt $i"
            sleep 3
          done
          echo "API did not become ready in time"
          docker logs api-test
          exit 1

      - name: Check /health endpoint
        run: curl -f http://localhost:3501/health

      - name: Stop container
        if: always()
        run: docker stop api-test && docker rm api-test